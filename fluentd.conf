<source>
  @type tail
  path C:/Program Files/pGina/log/pGina.Service.ServiceHost_log.txt
  pos_file C:/authnull-agent/fluentd/ldap.pos
  tag ldap_logs  # Changed tag to differentiate the source
  <parse>
    @type none
  </parse>
</source>

<label @PARTIAL>
  <match **>
    @type http
  endpoint https://prod.api.authnull.com/api/v1/log/endpoint/logit
  http_method post
  serializer json
<buffer>
    @type file
    path C:/authnull-agent/fluentd/buffer2
    flush_mode immediate
</buffer>
  </match>
</label>

<filter ldap_logs>
  @type grep
  <regexp>
    key message
    pattern /LdapPlugin: Found established TCP connection on port \d+ from IP:|LdapPlugin: Received username:|LdapPlugin: Authnull Service CallAuthnull Method:|LdapPlugin: Authnull Authz Service CallAuthnull Method 1:|LdapPlugin: Authnull Service CallAuthnull Method 1:|LocalMachine: Authnull Service CallAuthnull Method:|LocalMachine: Authnull Service CallAuthnull Method 1:/
  </regexp>
</filter>

<filter ldap_logs>
  @type grep
  <exclude>
    key message
    pattern /LdapPlugin: Authnull Service CallAuthnull Method: Trace 1|LdapPlugin: Authnull Service CallAuthnull Method: Trace 2|LdapPlugin: Authnull Service API Call Returns: Trace End|LdapPlugin: Authnull Service CallAuthnull Method: Trace Ending|LocalMachine: Authnull Service CallAuthnull Method: Trace 1|LocalMachine: Authnull Service CallAuthnull Method: Trace 2|LocalMachine: Authnull Service CallAuthnull Method: Trace Ending/
  </exclude>
</filter>

<filter ldap_logs>
  @type record_transformer
  enable_ruby true
  <record>
    message ${record["message"]}
    orgId 105
    tenantId 1
    component "windows-logs"
    IP "172.212.108.129"
  </record>
</filter>

<filter ldap_logs>
  @type concat
  key message
  multiline_start_regexp /^.*LdapPlugin: Found established TCP connection on port \d+ from IP:/
    separator "\n"
  flush_interval 60s
 timeout_label @PARTIAL 
  </filter>

<match ldap_logs>
  @type http
  endpoint https://prod.api.authnull.com/api/v1/log/endpoint/logit
  http_method post
  serializer json
<buffer>
    @type file
    path C:/authnull-agent/fluentd/buffer
    flush_mode immediate
</buffer> 
</match>

<source>
  @type tail
  path C:/authnull-agent/endpoint-agent.log
  pos_file C:/authnull-agent/fluentd/endpoint-agent.pos
  tag endpoint_logs  
  <parse>
    @type none
  </parse>
</source>

<filter endpoint_logs>
  @type record_transformer
  enable_ruby true
  <record>
    orgId "105"
    tenantId "1"
    component "endpoint-agent"
    IP "20.121.121.4"
    subComponent "windows"
  </record>
</filter>

<match endpoint_logs>
  @type http
  endpoint https://prod.api.authnull.com/api/v1/log/endpoint/logit
  http_method post
  serializer json
<buffer>
    @type file
    path C:/authnull-agent/fluentd/buffer1
    flush_mode immediate
</buffer>
</match>
