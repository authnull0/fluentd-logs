<source>
  @type tail
  path C:/Program Files/pGina/log/pGina.Service.ServiceHost_log.txt
  pos_file C:/authnull-agent/fluentd/ldap.pos
  tag ldap_logs  # Changed tag to differentiate the source
  <parse>
    @type none
  </parse>
</source>

#FILTER BLOCK FOR PGINA LOGS
<filter ldap_logs>
  @type record_transformer
  enable_ruby true
  <record>
    message ${record["message"]}
    orgId 105                     #Change Organization Id  
    tenantId 1                    #Change Tenant Id 
    component "windows-logs"
    machineName "BRCM-01"         #Change name of the windows machine which is onboarded
    IP "35.202.148.110"           #Change IP OF THE AD MACHINE to which windows machine is integrated 
 </record>
</filter>


<filter ldap_logs>
  @type concat
  key message
  multiline_start_regexp /Received username:/
  multiline_end_regexp /LdapPlugin: EndChain/
  flush_interval 60s

</filter>


<match ldap_logs>
  @type http
  endpoint https://prod.api.authnull.com/api/v1/log/endpoint/logit
  http_method post
  serializer json
<buffer>
    @type file
    path C:/authnull-agent/fluentd/buffer
    flush_mode immediate
</buffer> 
</match>

<source>
  @type tail
  path C:/authnull-agent/endpoint-agent.log
  pos_file C:/authnull-agent/fluentd/endpoint-agent.pos
  tag endpoint_logs  
  <parse>
    @type none
  </parse>
</source>

<filter endpoint_logs>
  @type record_transformer
  enable_ruby true
  <record>
    orgId "105"                   #Change Organization Id 
    tenantId "1"                  #Change Tenant Id  
    component "endpoint-agent"
    IP "20.121.121.4"             #Change Public Ip of the windows machine onboarded 
    machineName "BRCM-01"         #Change name of the windows machine onboarded 
    subComponent "Windows"
  </record>
</filter>

<match endpoint_logs>
  @type http
  endpoint https://prod.api.authnull.com/api/v1/log/endpoint/logit
  http_method post
  serializer json
<buffer>
    @type file
    path C:/authnull-agent/fluentd/buffer1
    flush_mode immediate
</buffer>
</match>
